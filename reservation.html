<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو وقت | ROYAL CUTS</title>
</head>
<link rel="stylesheet" href="css/reservation.css">

<body>

    <header class="header">
        <a href="SampleWork1.html" class="logo">ROYAL <span>CUTS</span></a>

        <nav>
            <a href="SampleWork1.html">صفحه اصلی</a>
            <a href="SampleWork1.html#services">خدمات ما</a>
            <a href="SampleWork1.html#gallery">گالری تصاویر</a>
        </nav>
    </header>

    <main class="reservation">
        <div class="reservation-title">
            <span class="subtitle">ROYAL CUTS BARBERSHOP</span>
            <h1>رزرو وقت</h1>
            <p>برای تجربه‌ای متفاوت از آراستگی، وقت خود را رزرو کنید.</p>
        </div>

        <form class="reservation-form">

            <div class="form-group">
                <label for="name">نام و نام خانوادگی</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="نام خود را وارد کنید"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">شماره تماس</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="مثلاً 09123456789"
                    required
                >
            </div>

            <div class="form-group">
                <label for="service">انتخاب خدمت</label>
                <select id="service" name="service" required>
                    <option value="">خدمت موردنظر را انتخاب کنید</option>
                    <option value="haircut">اصلاح مو - ۳۰۰ هزار تومان</option>
                    <option value="beard">اصلاح مو و ریش - ۱۵۰ هزار تومان</option>
                    <option value="fade">مدل موی فید - ۱۰۰ هزار تومان</option>
                    <option value="hair-repair">اصلاح صورت - ۱۵۰ هزار تومان</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date">تاریخ رزرو</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="time">ساعت رزرو</label>
                    <select id="time" name="time" required>
                        <option value="">انتخاب ساعت</option>
                        <option value="10:00">۱۰:۰۰</option>
                        <option value="12:00">۱۲:۰۰</option>
                        <option value="14:00">۱۴:۰۰</option>
                        <option value="16:00">۱۶:۰۰</option>
                        <option value="18:00">۱۸:۰۰</option>
                        <option value="20:00">۲۰:۰۰</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="description">توضیحات (اختیاری)</label>
                <textarea
                    id="description"
                    name="description"
                    rows="3"
                    placeholder="اگر درخواست خاصی دارید بنویسید..."
                ></textarea>
            </div>

            <button type="submit" class="reserve-btn">
              <a href="C:\Users\MoammerPC\Desktop\Sample work\success.html"> ثبت درخواست رزرو</a> 
            </button>

            <p class="form-note">
                پس از ثبت درخواست، برای هماهنگی نهایی با شما تماس گرفته می‌شود.
            </p>

        </form>
    </main>

    <footer class="footer">
        <p>© تمامی حقوق برای ROYAL CUTS محفوظ است.</p>
    </footer>

</body>
</html>
